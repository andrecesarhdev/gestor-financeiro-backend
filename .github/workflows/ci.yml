name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestor_financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gestor_financeiro_test?schema=public"
      JWT_SECRET: "test-secret-key-para-ci"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: ./backend
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Aplicar migrations
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Rodar testes
        working-directory: ./backend
        run: npm test

      - name: Build do projeto
        working-directory: ./backend
        run: npm run build